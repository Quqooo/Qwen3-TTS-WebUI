[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen3-tts-webui"
version = "0.1.0"
description = "Qwen3-TTS 全功能 Web 界面，支持声音克隆、预设音色合成、自然语言声音设计及批量处理"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Quqooo" },
]
keywords = ["tts", "text-to-speech", "voice-clone", "qwen", "webui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "websockets",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Quqooo/Qwen3-TTS-WebUI"
Repository = "https://github.com/Quqooo/Qwen3-TTS-WebUI"

[project.scripts]
qwen3-tts-webui = "backend.main:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
include = ["backend/static/**"]

[tool.hatch.build.targets.sdist]
include = [
    "backend/**",
    "frontend/*.ts",
    "frontend/*.js",
    "frontend/*.json",
    "frontend/index.html",
    "frontend/src/**",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]
